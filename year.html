<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Select Year - SmartLearn</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f5f7fb;
            color: #25253a;
        }

        header {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            padding: 35px 7%;
            text-align: center;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
        }

        h2 {
            text-align: center;
            margin-bottom: 30px;
        }

        .years {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .year-card {
            background: white;
            padding: 35px 20px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
            cursor: pointer;
            transition: 0.2s;
        }

        .year-card:hover {
            transform: translateY(-5px);
        }

        .year-icon {
            font-size: 40px;
        }

        .year-card h3 {
            margin-bottom: 10px;
        }

        .back-btn {
            margin-bottom: 25px;
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            background: #6c63ff;
            color: white;
            cursor: pointer;
        }
               /* BACK BUTTON */
.back-btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;

    text-decoration: none;

    background: white;
    color: #6c63ff;

    padding: 13px 22px;
    border-radius: 14px;

    font-size: 15px;
    font-weight: bold;

    border: 2px solid #e0e7ff;

    box-shadow: 0 6px 18px rgba(108, 99, 255, 0.12);

    margin-bottom: 25px;

    transition: all 0.3s ease;
}

.back-btn:hover {
    background: linear-gradient(135deg, #6c63ff, #8b5cf6);
    color: white;

    border-color: transparent;

    transform: translateX(-5px);

    box-shadow: 0 10px 25px rgba(108, 99, 255, 0.25);
}
    </style>
</head>

<body>

<header>
   <h1>📚 SmartLearn Lessons</h1>
<p>Choose your Year</p>
</header>

<div class="container">

    <button class="back-btn" onclick="goBack()">
        ← Back to Dashboard
    </button>

    <h2>Select Your Year</h2>

    <div class="years">

        <div class="year-card" onclick="selectYear(1)">
            <div class="year-icon">🌱</div>
            <h3>Year 1</h3>
            <p>Games for Year 1</p>
        </div>

<div class="year-card" onclick="window.location.href='year2.html'">
    <div class="year-icon">🌟</div>
    <h3>Year 2</h3>
    <p>Games for Year 2</p>
</div>

        <div class="year-card" onclick="selectYear(3)">
            <div class="year-icon">🚀</div>
            <h3>Year 3</h3>
            <p>Games for Year 3</p>
        </div>

        <div class="year-card" onclick="selectYear(4)">
            <div class="year-icon">📚</div>
            <h3>Year 4</h3>
            <p>Games for Year 4</p>
        </div>

        <div class="year-card" onclick="selectYear(5)">
            <div class="year-icon">🏆</div>
            <h3>Year 5</h3>
            <p>Games for Year 5</p>
        </div>

        <div class="year-card" onclick="selectYear(6)">
            <div class="year-icon">🎓</div>
            <h3>Year 6</h3>
            <p>Games for Year 6</p>
        </div>

    </div>

</div>

<script>

function selectYear(year) {
    window.location.href = "game.html?year=" + year;
}

function goBack() {
    window.location.href = "dashboard.html";
}

</script>

</body>
</html>
