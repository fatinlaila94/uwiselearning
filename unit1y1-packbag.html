<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    font-family:'DM Sans',sans-serif;
    color:#fff;

    background:
        radial-gradient(circle at 15% 10%, rgba(99,102,241,.22), transparent 32%),
        radial-gradient(circle at 85% 90%, rgba(168,85,247,.18), transparent 32%),
        linear-gradient(135deg,#080b18,#11162b 50%,#080b18);

    justify-content:center;
    align-items:center;

    padding:25px;
}

.container{
    width:100%;

}

/* =========================
   BACK BUTTON
========================= */

.back-btn{
    display:inline-flex;
    align-items:center;
    gap:8px;

    text-decoration:none;
    color:#cbd5e1;

    font-size:14px;
    font-weight:700;

    margin-bottom:18px;

    padding:9px 15px;

    border:1px solid rgba(255,255,255,.1);
    background:rgba(255,255,255,.04);

    border-radius:12px;

    transition:.25s;
}

.back-btn:hover{
    color:#fff;
    background:rgba(255,255,255,.08);
    transform:translateX(-2px);
}


/* =========================
   CARD
========================= */

.card{
    background:rgba(15,23,42,.78);

    border:1px solid rgba(255,255,255,.09);

    border-radius:28px;

    padding:32px;

    box-shadow:

}


/* =========================
   START SCREEN
========================= */

}

.badge{

    gap:7px;

    border-radius:30px;

    background:rgba(99,102,241,.12);

    color:#a5b4fc;

    font-size:13px;
    font-weight:800;

    margin-bottom:18px;
}

.start-screen h1{
    font-family:'Outfit',sans-serif;

    font-size:42px;

    margin:0 0 10px;

    letter-spacing:-1px;
}

.subtitle{
    color:#94a3b8;

    font-size:15px;

    line-height:1.6;

    max-width:560px;

    margin:0 auto 28px;
}


/* =========================
   FORM
========================= */

.form-group{
    text-align:left;
    margin-bottom:17px;
}

.form-group label{
    display:block;

    font-size:13px;
    font-weight:700;

    color:#cbd5e1;

    margin-bottom:8px;
}

.form-group input{
    width:100%;

    padding:14px 16px;

    border-radius:14px;

    border:1px solid rgba(255,255,255,.1);

    background:rgba(255,255,255,.05);

    color:#fff;

    outline:none;

    font-family:inherit;

    font-size:14px;

    transition:.2s;
}

.form-group input::placeholder{
    color:#64748b;
}

.form-group input:focus{
    border-color:rgba(129,140,248,.6);

    background:rgba(255,255,255,.07);

    box-shadow:
        0 0 0 3px rgba(99,102,241,.08);
}


/* =========================
   START BUTTON
========================= */

.start-btn,
.retry-btn{
    width:100%;

    border:none;

    border-radius:15px;

    padding:15px;

    margin-top:7px;

    font-family:inherit;

    font-size:15px;

    font-weight:800;

    color:#fff;

    cursor:pointer;

    background:
        linear-gradient(135deg,#6366f1,#8b5cf6);

    box-shadow:
        0 12px 30px rgba(99,102,241,.25);

    transition:.25s;
}

.start-btn:hover,
.retry-btn:hover{
    transform:translateY(-2px);

    box-shadow:
        0 16px 35px rgba(99,102,241,.35);
}


/* =========================
   GAME
========================= */

.game-screen{
    display:none;
}

.top-info{
    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:15px;

    margin-bottom:18px;
}

.unit-label{
    color:#a5b4fc;

    font-size:13px;

    font-weight:800;

    letter-spacing:.5px;
}

.question-number{
    color:#94a3b8;

    font-size:13px;

    font-weight:700;
}


/* =========================
   PROGRESS
========================= */

.progress-wrap{
    width:100%;

    height:7px;

    border-radius:20px;

    background:rgba(255,255,255,.07);

    overflow:hidden;

    margin-bottom:24px;
}

.progress-bar{
    height:100%;

    width:0%;

    border-radius:20px;

    background:
        linear-gradient(90deg,#6366f1,#a855f7);

    transition:.4s ease;
}


/* =========================
   STATS
========================= */

.stats{
    display:grid;

    grid-template-columns:1fr 1fr;

    gap:12px;

    margin-bottom:22px;
}

.stat{
    padding:14px;

    border-radius:16px;

    background:rgba(255,255,255,.035);

    border:1px solid rgba(255,255,255,.06);
}

.stat-title{
    font-size:11px;

    color:#64748b;

    font-weight:800;

    text-transform:uppercase;

    letter-spacing:.6px;
}

.stat-value{
    margin-top:4px;

    font-family:'Outfit',sans-serif;

    font-size:20px;

    font-weight:800;
}


/* =========================
   TIMER
========================= */

.timer-wrap{
    display:flex;

    justify-content:center;

    margin-bottom:18px;
}

.timer{
    width:64px;
    height:64px;

    border-radius:50%;

    display:flex;

    justify-content:center;

    align-items:center;

    font-family:'Outfit',sans-serif;

    font-size:20px;

    font-weight:800;

    background:rgba(99,102,241,.1);

    border:2px solid rgba(129,140,248,.35);

    box-shadow:
        0 0 25px rgba(99,102,241,.12);

    transition:.2s;
}

.timer.warning{
    border-color:rgba(239,68,68,.65);

    background:rgba(239,68,68,.08);

    color:#fca5a5;
}


/* =========================
   LO BADGE
========================= */

.lo-wrap{
    text-align:center;
}

.lo-badge{
    display:inline-block;

    padding:6px 10px;

    border-radius:8px;

    background:rgba(168,85,247,.1);

    color:#c4b5fd;

    font-size:11px;

    font-weight:800;

    margin-bottom:12px;

    border:1px solid rgba(168,85,247,.18);
}


/* =========================
   QUESTION
========================= */

.question{
    font-family:'Outfit',sans-serif;

    font-size:27px;

    line-height:1.3;

    font-weight:700;

    text-align:center;

    margin:0 auto 24px;

    max-width:600px;
}


/* =========================
   BAG AREA
========================= */

.bag-area{
    display:flex;

    justify-content:center;

    margin-bottom:22px;
}

.school-bag{
    width:150px;
    height:135px;

    border-radius:35px 35px 25px 25px;

    position:relative;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:70px;

    background:

            rgba(99,102,241,.35),
            rgba(168,85,247,.25)

    border:1px solid rgba(165,180,252,.25);

    box-shadow:
        0 20px 45px rgba(0,0,0,.28),
        inset 0 1px 0 rgba(255,255,255,.08);

    transition:.25s;
}

.school-bag::before{
    content:"";

    position:absolute;

    width:58px;
    height:23px;

    top:-15px;

    border:5px solid rgba(165,180,252,.4);

    border-bottom:none;

    border-radius:30px 30px 0 0;
}

.school-bag.pack-success{
    transform:scale(1.06);

    box-shadow:
        0 0 35px rgba(99,102,241,.28),
        inset 0 1px 0 rgba(255,255,255,.1);
}


/* =========================
   ITEM GRID
========================= */

.items-grid{
    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:12px;
}

.item-btn{
    min-height:105px;

    border-radius:18px;

    border:1px solid rgba(255,255,255,.08);

    background:rgba(255,255,255,.035);

    color:#fff;

    font-family:inherit;

    cursor:pointer;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    gap:7px;

    transition:.2s;

    position:relative;

    overflow:hidden;
}

.item-btn:hover:not(:disabled){
    transform:translateY(-3px);

    background:rgba(99,102,241,.09);

    border-color:rgba(129,140,248,.4);

    box-shadow:
        0 10px 25px rgba(0,0,0,.18);

.item-icon{
    font-size:36px;

    line-height:1;
}

.item-name{
    font-size:12px;

    font-weight:700;

    color:#cbd5e1;
}

.item-btn.correct{
    background:rgba(34,197,94,.12);

    border-color:rgba(34,197,94,.55);
}

.item-btn.correct .item-name{
    color:#86efac;
}

.item-btn.wrong{
    background:rgba(239,68,68,.12);

    border-color:rgba(239,68,68,.55);
}

.item-btn.wrong .item-name{
    color:#fca5a5;
}

.item-btn.packed{
    opacity:.45;

    transform:scale(.97);
}

.item-btn:disabled{
    cursor:default;
}


/* =========================
   FEEDBACK
========================= */

.feedback{
    min-height:27px;

    text-align:center;

    margin-top:18px;

    font-size:14px;

    font-weight:800;
}

.feedback.correct-text{
    color:#86efac;
}

.feedback.wrong-text{
    color:#fca5a5;

/* =========================

.result-screen{
    display:none;

    text-align:center;
}

.result-icon{
    width:85px;
    height:85px;

    border-radius:50%;

    margin:0 auto 20px;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:38px;

    background:rgba(99,102,241,.12);

    border:1px solid rgba(129,140,248,.25);
}

.result-screen h2{
    font-family:'Outfit',sans-serif;

    font-size:36px;

    margin:0 0 8px;
}

.result-name{
    color:#94a3b8;

    font-size:14px;

    margin-bottom:25px;
}

.final-score{
    font-family:'Outfit',sans-serif;

    font-size:58px;

    font-weight:800;

    margin:8px 0;

    background:
        linear-gradient(135deg,#a5b4fc,#d8b4fe);

.score-label{
    color:#64748b;

    font-size:13px;

    font-weight:700;
}

.result-grid{
    display:grid;

    grid-template-columns:1fr 1fr;

    gap:12px;

    margin:25px 0;
}

.result-box{
    padding:17px;

    border-radius:16px;

    background:rgba(255,255,255,.035);

    border:1px solid rgba(255,255,255,.06);

.result-box strong{
    display:block;

    font-size:23px;

    margin-bottom:3px;

.result-box span{
    font-size:11px;

    color:#64748b;

    font-weight:700;

/* =========================

@media(max-width:650px){

    body{

    }

    .card{

        border-radius:22px;
    }

    .start-screen h1{
        font-size:34px;
    }

    .question{
        font-size:23px;
    }

    .items-grid{
        grid-template-columns:
            repeat(2,1fr);
    }

    .item-btn{
        min-height:95px;
    }

    .final-score{
        font-size:50px;
    }
}

</style>
</head>

===================================================== */

    studentName =
        document

    studentClass =

        .value
        .trim();

   LOAD MISSION
===================================================== */

function loadMission(){

    answered = false;

    clearInterval(timerInterval);


    const mission =
        missions[currentMission];


    document
        .getElementById("questionNumber")
        .textContent =
        `Round ${currentMission + 1} / ${missions.length}`;


    document
        .getElementById("progressBar")
        .style.width =
        `${(currentMission / missions.length) * 100}%`;


    document
        .getElementById("loBadge")
        .textContent =
        mission.lo;


    document
        .getElementById("questionText")
        .textContent =
        mission.question;


    document
        .getElementById("feedback")
        .textContent = "";


    document
        .getElementById("feedback")
        .className =
        "feedback";


    const grid =
        document
        .getElementById("itemsGrid");


    grid.innerHTML = "";


    /* CREATE ITEM BUTTONS */

    mission.items.forEach(itemId => {

        const item =
            getItem(itemId);


        if(!item) return;


        const button =
            document.createElement("button");


        button.className =
            "item-btn";


        button.dataset.item =
            item.id;


        button.innerHTML = `

            <div class="item-icon">
                ${item.icon}
            </div>

            <div class="item-name">
                ${item.name}
            </div>

        `;


        button.onclick =
            () => selectItem(
                item.id,
                button
            );


        grid.appendChild(button);

    });


    startTimer();

}


/* =====================================================
   TIMER
===================================================== */

function startTimer(){

    timeLeft = 20;


    const timer =
        document
        .getElementById("timer");


    timer.textContent =
        timeLeft;


    timer.classList.remove(
        "warning"
    );


    timerInterval =
        setInterval(() => {

            timeLeft--;


            timer.textContent =
                timeLeft;


            if(timeLeft <= 5){

                timer.classList.add(
                    "warning"
                );

            }


            if(timeLeft <= 0){

                clearInterval(
                    timerInterval
                );


                if(!answered){

                    timeUp();

                }

            }

        },1000);

}


/* =====================================================
   SELECT ITEM
===================================================== */

function selectItem(
    selectedId,
    button
){

    if(answered) return;


    answered = true;


    clearInterval(
        timerInterval
    );


    const mission =
        missions[currentMission];


    const isCorrect =
        mission.correct.includes(
            selectedId
        );


    const buttons =
        document.querySelectorAll(
            ".item-btn"
        );


    buttons.forEach(
        btn => btn.disabled = true
    );


    if(isCorrect){

        /* =====================
           CORRECT
        ===================== */

        score++;

        streak++;


        if(streak > bestStreak){

            bestStreak =
                streak;

        }


        button.classList.add(
            "correct"
        );


        button.classList.add(
            "packed"
        );


        const bag =
            document.getElementById(
                "schoolBag"
            );


        bag.classList.add(
            "pack-success"
        );


        setTimeout(() => {

            bag.classList.remove(
                "pack-success"
            );

        },500);


        const feedback =
            document.getElementById(
                "feedback"
            );


        feedback.textContent =
            "✓ Great choice! Into the bag!";


        feedback.className =
            "feedback correct-text";


    }else{

        /* =====================
           WRONG
        ===================== */

        streak = 0;


        button.classList.add(
            "wrong"
        );


        /* SHOW CORRECT */

        buttons.forEach(btn => {

            if(
                mission.correct
                .includes(
                    btn.dataset.item
                )
            ){

                btn.classList.add(
                    "correct"
                );

            }

        });


        const feedback =
            document.getElementById(
                "feedback"
            );


        feedback.textContent =
            "✕ Not quite! Look carefully.";


        feedback.className =
            "feedback wrong-text";

    }


    updateScore();


    /* AUTO NEXT */

    setTimeout(() => {

        nextMission();

    },1200);

}


/* =====================================================
   TIME UP
===================================================== */

function timeUp(){

    answered = true;

    streak = 0;


    const mission =
        missions[currentMission];


    const buttons =
        document.querySelectorAll(
            ".item-btn"
        );


    buttons.forEach(btn => {

        btn.disabled = true;


        if(
            mission.correct
            .includes(
                btn.dataset.item
            )
        ){

            btn.classList.add(
                "correct"
            );

        }

    });


    const feedback =
        document.getElementById(
            "feedback"
        );


    feedback.textContent =
        "⏰ Time's up!";


    feedback.className =
        "feedback wrong-text";


    updateScore();


    setTimeout(() => {

        nextMission();

    },1200);

}


/* =====================================================
   NEXT MISSION
===================================================== */

function nextMission(){

    currentMission++;


    if(
        currentMission <
        missions.length
    ){

        loadMission();

    }else{

        finishGame();

    }

}


/* =====================================================
   UPDATE SCORE
===================================================== */

function updateScore(){

    document
        .getElementById("scoreDisplay")
        .textContent =
        `${score} / ${missions.length}`;


    document
        .getElementById("streakDisplay")
        .textContent =
        `🔥 ${streak}`;

}


/* =====================================================
   FINISH GAME
===================================================== */

async function finishGame(){

    clearInterval(
        timerInterval
    );


    document
        .getElementById("gameScreen")
        .style.display = "none";


    document
        .getElementById("resultScreen")
        .style.display = "block";


    const totalQuestions =
        missions.length;


    /* CORRECT FORMULA */

    const percentage =
        Math.round(
            (score / totalQuestions) * 100
        );


    /* FINAL DISPLAY */

    document
        .getElementById("finalMarks")
        .textContent =
        `${score} / ${totalQuestions}`;


    document
        .getElementById("finalPercentage")
        .textContent =
        `${percentage}%`;


    document
        .getElementById("finalStreak")
        .textContent =
        `🔥 ${bestStreak}`;


    document
        .getElementById("resultName")
        .textContent =
        `${studentName} • ${studentClass}`;


    /* 100% PROGRESS */

    document
        .getElementById("progressBar")
        .style.width =
        "100%";


    /* SAVE */

    await saveScore(
        score,
        totalQuestions
    );

}


/* =====================================================
   SAVE TO SUPABASE
===================================================== */

async function saveScore(
    finalScore,
    totalQuestions
){

    try{

        let userId = null;


        /* GET USER */

        const {
            data: userData
        } =
        await supabaseClient
        .auth
        .getUser();


        if(
            userData &&
            userData.user
        ){

            userId =
                userData.user.id;

        }


        /* INSERT */

        const {
            data,
            error
        } =
        await supabaseClient
        .from("quiz_scores")
        .insert([{

            user_id:
                userId,

            name:
                studentName,

            class_name:
                studentClass,

            score:
                finalScore,

            "total questions":
                totalQuestions,

            unit:
                "At School",

            activity:
                "Pack My School Bag"

        }]);


        if(error){

            console.error(
                "Supabase save error:",
                error
            );

        }else{

            console.log(
                "Pack My School Bag score saved:",
                data
            );

        }

    }catch(error){

        console.error(
            "Supabase error:",
            error
        );

    }

}

</script>
