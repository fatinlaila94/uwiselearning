<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Word Scramble - SmartLearn</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f5f7fb;
            color: #25253a;
        }

        header {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            padding: 30px 7%;
        }

        .container {
            max-width: 700px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .game-card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.06);
            text-align: center;
        }

        .scrambled-word {
            font-size: 38px;
            font-weight: bold;
            letter-spacing: 8px;
            margin: 30px 0;
            color: #4f46e5;
        }

        input {
            width: 80%;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 12px;
            font-size: 18px;
            text-align: center;
        }

        .check-btn {
            margin-top: 15px;
            padding: 14px 25px;
            border: none;
            border-radius: 12px;
            background: #4f46e5;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .check-btn:hover {
            background: #3730a3;
        }

        #result {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
        }

        #score {
            margin-top: 15px;
            font-size: 18px;
        }

        .back-btn {
            background: #6c63ff;
            color: white;
            margin-bottom: 20px;
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<header>
    <h1>🔤 Word Scramble</h1>
    <p>Unscramble the letters and find the correct word!</p>
</header>

<div class="container">

    <button class="back-btn" onclick="goBack()">← Back</button>

    <div class="game-card">

        <h2>Unscramble the Word</h2>

        <p>Arrange the letters to make a correct English word.</p>

        <div class="scrambled-word" id="scrambledWord"></div>

        <input type="text" id="answer" placeholder="Type your answer">

        <br>

        <button class="check-btn" onclick="checkAnswer()">
            Check Answer
        </button>

        <p id="result"></p>

        <p id="score">Score: 0/10</p>

    </div>

</div>

<script>

const words = [
    "COFFEE",
    "NOODLES",
    "WATER",
    "CHICKEN",
    "JELLY",
    "PUDDING",
    "CAKE",
    "APPLE",
    "SANDWICH",
    "MILK"
];

let currentIndex = 0;
let score = 0;

function scrambleWord(word) {
    return word
        .split("")
        .sort(() => Math.random() - 0.5)
        .join("");
}

function showWord() {

    document.getElementById("scrambledWord").textContent =
        scrambleWord(words[currentIndex]);

    document.getElementById("answer").value = "";

    document.getElementById("result").textContent = "";
}

function checkAnswer() {

    const answer = document
        .getElementById("answer")
        .value
        .trim()
        .toUpperCase();

    if (answer === words[currentIndex]) {

        score++;

        document.getElementById("result").textContent =
            "✅ Correct!";

        document.getElementById("score").textContent =
            "Score: " + score + "/10";

        currentIndex++;

        if (currentIndex < words.length) {

            setTimeout(showWord, 800);

        } else {

            document.getElementById("result").textContent =
                "🏆 Well done! You completed the game!";

            document.getElementById("score").textContent =
                "Final Score: " + score + "/10";
        }

    } else {

        document.getElementById("result").textContent =
            "❌ Wrong answer. Try again!";
    }
}

function goBack() {
    window.location.href = "game.html";
}

showWord();

</script>

</body>

</html>
