            box-shadow: 0 10px 30px rgba(108, 99, 255, 0.20);

        .header .small-title {
            font-size: 14px;

            letter-spacing: 2px;

            font-size: 38px;

        .header p {
            font-size: 16px;
            opacity: 0.95;
        }

        /* MAIN */
        .container {
            width: 90%;
            max-width: 1100px;
            margin: -20px auto 50px;
        }

        .intro-card {
            background: white;
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.07);
            text-align: center;
        }

        .intro-card h2 {

            margin-bottom: 8px;
        }

        .intro-card p {
            color: #6b7280;
            line-height: 1.6;
        }

        /* TOPIC GRID */
        .topic-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .topic-card {
            width: 100%;
            border: none;
            background: white;
            border-radius: 20px;
            padding: 22px;
            display: flex;
            align-items: center;
            gap: 16px;
            text-align: left;
            cursor: pointer;
            box-shadow: 0 7px 20px rgba(0, 0, 0, 0.07);
            transition: all 0.25s ease;
            position: relative;
            overflow: hidden;
        }

        .topic-card::before {
            content: "";
            position: absolute;
            left: 0;
            top: 0;
            width: 5px;
            height: 100%;
            background: linear-gradient(#6c63ff, #8b5cf6);
        }

        .topic-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 14px 30px rgba(108, 99, 255, 0.18);
        }

        .topic-icon {
            min-width: 58px;
            width: 58px;
            height: 58px;
            border-radius: 16px;
            background: #f0edff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
        }

        .topic-info {
            flex: 1;
        }

        .topic-info .unit {
            font-size: 12px;
            font-weight: bold;
            color: #8b5cf6;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .topic-info h3 {
            font-size: 17px;
            color: #1f2937;
            line-height: 1.3;
        }

        .arrow {
            font-size: 22px;
            color: #8b5cf6;
            font-weight: bold;
        }

        /* FOOTER */
        .footer {
            text-align: center;
            color: #6b7280;
            font-size: 13px;
            padding: 10px 20px 30px;
        }

        /* TABLET */
        @media (max-width: 850px) {
            .topic-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        /* MOBILE */
        @media (max-width: 600px) {
            .header h1 {
                font-size: 30px;
            }

            .container {
                width: 92%;
            }

            .topic-grid {

            }

            .topic-card {

            }
        }
    </style>
</head>
