```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Login</title>

    <link rel="stylesheet" href="style.css">

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

    <header>
        <h1>SmartLearn Online</h1>
        <p>Student Login</p>
    </header>

    <main>

        <h2>Welcome Back! 👋</h2>

        <form id="loginForm">

            <label>Email</label>
            <br>

            <input 
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >

            <br><br>

            <label>Password</label>
            <br>

            <input 
                type="password"
                id="password"
                placeholder="Enter your password"
                required
            >

            <br><br>

            <button type="submit">
                Login
            </button>

        </form>

        <p id="message"></p>

        <p>
            Don't have an account?
            <a href="register.html">Register</a>
        </p>
    </main>

    <script>
        // =========================
        // SUPABASE CONNECTION
        // =========================

        const SUPABASE_URL = "https://exaohyhqllzylcfyqtge.supabase.co";
        const SUPABASE_KEY = "sb_publishable_35_gdLzcN8dsWsd8lChybg_WVZPonzO";

        const supabaseClient = window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


        // =========================
        // LOGIN
        // =========================

        document.getElementById("loginForm").addEventListener("submit", async function(event) {

            event.preventDefault();

            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;
            const message = document.getElementById("message");

            message.innerText = "Logging in...";

            const { data, error } = await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password
            });

            if (error) {
                console.error(error);
                message.innerText = "Login failed: " + error.message;
                return;
            }

            console.log("Login successful:", data);

            message.innerText = "Login successful!";

            // Pergi ke homepage selepas login
            setTimeout(function() {
                window.location.href = "index.html";
            }, 1000);

        });
    </script>

</body>
</html>
```
