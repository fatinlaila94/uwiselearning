<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Marks - SmartLearn</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f5f7fb;
            color: #25253a;
        }

        header {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            padding: 30px 7%;
        }

        header h1 {
            margin: 0;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .back-btn {
            background: #6c63ff;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 10px;
            cursor: pointer;
            margin-bottom: 25px;
        }

        .marks-card {
            background: white;
            padding: 25px;
            border-radius: 18px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.06);
        }

        .score {
            padding: 18px;
            border-bottom: 1px solid #eee;
        }

        .score:last-child {
            border-bottom: none;
        }
    </style>
</head>

<body>

<header>
    <h1>🏆 My Marks</h1>
    <p>SmartLearn Online</p>
</header>

<div class="container">

    <button class="back-btn" onclick="goBack()">← Back to Dashboard</button>

    <div class="marks-card">
        <h2>My Quiz Results</h2>

        <div class="score">
            🎮 Quiz 1 — <strong>8 / 10</strong>
        </div>

        <div class="score">
            🎮 Quiz 2 — <strong>7 / 10</strong>
        </div>

        <div class="score">
            🎮 Quiz 3 — <strong>9 / 10</strong>
        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
    const SUPABASE_URL = "https://exaohyhqllzylcfyqtge.supabase.co";
    const SUPABASE_KEY = "sb_publishable_35_gdLzcN8dsWsd8lChybg_WVZPonzO";

    const supabaseClient = supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );

    function goBack() {
        async function loadMarks() {

    const { data: userData, error: userError } =
        await supabaseClient.auth.getUser();

    if (userError || !userData.user) {
        window.location.href = "login.html";
        return;
    }

    const userId = userData.user.id;

    const { data, error } = await supabaseClient
        .from("quiz_scores")
        .select("*")
        .eq("user_id", userId)
        .order("created_at", { ascending: false });

    if (error) {
        console.log(error);
        return;
    }

    console.log(data);
}
        window.location.href = "dashboard.html";
    }
</script>

</body>
</html>
