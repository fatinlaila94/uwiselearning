```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - SmartLearn Online</title>

    <link rel="stylesheet" href="style.css">

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

    <header>
        <h1>SmartLearn Online</h1>
        <p>Create Your Account</p>
    </header>

    <main>

        <h2>Join SmartLearn 🚀</h2>

        <form id="registerForm">

            <label>Full Name</label>
            <br>

            <input
                type="text"
                id="fullName"
                placeholder="Enter your name"
                required
            >

            <br><br>

            <label>Email</label>
            <br>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >

            <br><br>

            <label>Password</label>
            <br>

            <input
                type="password"
                id="password"
                placeholder="Create a password"
                required
            >

            <br><br>

            <button type="submit">
                Create Account
            </button>

        </form>

        <p id="message"></p>

        <p>
            Already have an account?
            <a href="login.html">Login</a>
        </p>

    </main>

    <script>
        // =========================
        // SUPABASE CONNECTION
        // =========================

        const SUPABASE_URL = "https://exaohyhqllzylcfyqtge.supabase.co";
        const SUPABASE_KEY = "sb_publishable_35_gdLzcN8dsWsd8lChybg_WVZPonzO";

        const supabaseClient = window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


        // =========================
        // REGISTER
        // =========================

        document.getElementById("registerForm").addEventListener("submit", async function(event) {

            event.preventDefault();

            const fullName = document.getElementById("fullName").value;
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;
            const message = document.getElementById("message");

            message.innerText = "Creating account...";

            const { data, error } = await supabaseClient.auth.signUp({
                email: email,
                password: password,
                options: {
                    data: {
                        full_name: fullName
                    }
                }
            });

            if (error) {
                console.error(error);
                message.innerText = "Error: " + error.message;
                return;
            }

            console.log("Registration successful:", data);

            message.innerText =
                "Account created successfully! Please check your email if confirmation is required.";

            document.getElementById("registerForm").reset();

        });
    </script>

</body>
</html>
```
